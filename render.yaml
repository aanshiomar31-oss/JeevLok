services:
  # ==============================================================================
  # JeevLok AI — FastAPI Backend Web Service
  # ==============================================================================
  - type: web
    name: jeevlok-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: JeevLok AI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: local

  # ==============================================================================
  # JeevLok AI — React / Vite Frontend Static Site
  # ==============================================================================
  - type: static
    name: jeevlok-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jeevlok-backend
          property: host
